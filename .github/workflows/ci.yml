name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Tests that need Windows PowerShell skip themselves outside WSL.
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
